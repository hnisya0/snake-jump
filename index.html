<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Snake Jump Modern</title>
    <style>
        /* CSS STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            color: #fff;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlay */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .score-board {
            font-size: 24px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Modal Overlay */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
        }

        .modal-content {
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #0f3460;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }

        .modal h1 {
            color: #00ffcc;
            margin-bottom: 15px;
        }

        .modal input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: none;
            background: #0f3460;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .btn {
            background: linear-gradient(45deg, #00ffcc, #0099ff);
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 160px;
            z-index: 10;
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            background: rgba(0, 255, 204, 0.5);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        .jump-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(0, 255, 204, 0.3);
            border: 2px solid #00ffcc;
            color: white;
            font-weight: bold;
            font-size: 16px;
            align-self: flex-end;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        .hidden { display: none !important; }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <!-- Dashboard Skor UI -->
    <div id="ui-container">
        <div class="score-board">Skor: <span id="score">0</span></div>
    </div>

    <!-- Kontrol Mobile / Android -->
    <div id="mobile-controls">
        <div class="d-pad">
            <div class="ctrl-btn btn-up" id="ctrl-up">▲</div>
            <div class="ctrl-btn btn-left" id="ctrl-left">◄</div>
            <div class="ctrl-btn btn-right" id="ctrl-right">►</div>
            <div class="ctrl-btn btn-down" id="ctrl-down">▼</div>
        </div>
        <div class="jump-btn" id="ctrl-jump">JUMP</div>
    </div>

    <!-- Start / Game Over Modal -->
    <div id="game-modal" class="modal">
        <div class="modal-content">
            <h1 id="modal-title">3D SNAKE JUMP</h1>
            <p id="modal-desc">Gunakan panah untuk bergerak, SPACE / Tombol Jump untuk melompati rintangan/ekor!</p>
            <input type="text" id="player-name" placeholder="Masukkan Nama Anda" maxlength="15">
            <button class="btn" id="start-btn">MAIN GAME</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION & DATABASE
        // ==========================================
        // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA!
        const GOOGLE_SHEETS_WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

        // Game Settings
        const BOARD_SIZE = 16;
        const SPEED = 200; // ms per frame movement

        // Game Variables
        let scene, camera, renderer;
        let snake = [];
        let snakeData = [];
        let food, obstacles = [];
        let direction = { x: 1, z: 0 };
        let nextDirection = { x: 1, z: 0 };
        let score = 0;
        let isJumping = false;
        let jumpProgress = 0;
        let gameInterval = null;
        let isGameOver = false;
        let playerName = "Pemain";

        // Audio Effects (Synthesized using Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'eat') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'jump') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'over') {
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // ==========================================
        // THREE.JS GRAPHICS SETUP
        // ==========================================
        function init3D() {
            const container = document.getElementById('webgl-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 15, 35);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 18, 15);
            camera.lookAt(0, 0, 2);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            // Board (Grid Ground)
            const gridHelper = new THREE.GridHelper(BOARD_SIZE, BOARD_SIZE, 0x00ffcc, 0x0f3460);
            gridHelper.position.y = -0.5;
            scene.add(gridHelper);

            const boardGeo = new THREE.BoxGeometry(BOARD_SIZE, 0.2, BOARD_SIZE);
            const boardMat = new THREE.MeshPhongMaterial({ color: 0x16213e });
            const boardMesh = new THREE.Mesh(boardGeo, boardMat);
            boardMesh.position.y = -0.6;
            boardMesh.receiveShadow = true;
            scene.add(boardMesh);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // GAME LOGIC & CREATION
        // ==========================================
        function createCube(color, isHead = false) {
            const geo = isHead 
                ? new THREE.SphereGeometry(0.45, 16, 16)
                : new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const mat = new THREE.MeshStandardMaterial({ 
                color: color, 
                roughness: 0.3,
                metalness: 0.2 
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        function resetGame() {
            // Clear existing objects
            snake.forEach(segment => scene.remove(segment));
            if (food) scene.remove(food);
            obstacles.forEach(obs => scene.remove(obs));

            snake = [];
            snakeData = [];
            obstacles = [];
            score = 0;
            document.getElementById('score').innerText = score;
            direction = { x: 1, z: 0 };
            nextDirection = { x: 1, z: 0 };
            isJumping = false;
            isGameOver = false;

            // Spawn Initial Snake
            const startX = 0, startZ = 0;
            for (let i = 0; i < 3; i++) {
                const pos = { x: startX - i, y: 0, z: startZ };
                snakeData.push(pos);
                const seg = createCube(i === 0 ? 0x00ffcc : 0x0099ff, i === 0);
                seg.position.set(pos.x, pos.y, pos.z);
                snake.push(seg);
            }

            spawnFood();
            spawnObstacles();
        }

        function spawnFood() {
            if (food) scene.remove(food);
            let x, z, collision;
            do {
                collision = false;
                x = Math.floor(Math.random() * (BOARD_SIZE - 2)) - (BOARD_SIZE / 2 - 1);
                z = Math.floor(Math.random() * (BOARD_SIZE - 2)) - (BOARD_SIZE / 2 - 1);

                snakeData.forEach(s => { if (s.x === x && s.z === z) collision = true; });
                obstacles.forEach(o => { if (o.position.x === x && o.position.z === z) collision = true; });
            } while (collision);

            const geo = new THREE.DodecahedronGeometry(0.4);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xaa0033 });
            food = new THREE.Mesh(geo, mat);
            food.position.set(x, 0, z);
            food.castShadow = true;
            scene.add(food);
        }

        function spawnObstacles() {
            const count = 4; // Jumlah rintangan merah
            for(let i = 0; i < count; i++) {
                let x, z, collision;
                do {
                    collision = false;
                    x = Math.floor(Math.random() * (BOARD_SIZE - 4)) - (BOARD_SIZE / 2 - 2);
                    z = Math.floor(Math.random() * (BOARD_SIZE - 4)) - (BOARD_SIZE / 2 - 2);
                    
                    if (Math.abs(x) < 3 && Math.abs(z) < 3) collision = true; // Jangan terlalu dekat dengan spawn
                } while (collision);

                const geo = new THREE.ConeGeometry(0.4, 1, 8);
                const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
                const obs = new THREE.Mesh(geo, mat);
                obs.position.set(x, 0, z);
                obs.castShadow = true;
                scene.add(obs);
                obstacles.push(obs);
            }
        }

        function jump() {
            if (!isJumping && !isGameOver) {
                isJumping = true;
                jumpProgress = 0;
                playSound('jump');
            }
        }

        function gameLoop() {
            if (isGameOver) return;

            direction = { ...nextDirection };

            // Calculate new Head position
            let newX = snakeData[0].x + direction.x;
            let newZ = snakeData[0].z + direction.z;
            let newY = 0;

            // Handle Jump logic
            if (isJumping) {
                jumpProgress += 1;
                if (jumpProgress === 1) newY = 1.5; // Ketinggian Lompatan
                else if (jumpProgress >= 2) {
                    newY = 0;
                    isJumping = false; // Mendarat
                }
            }

            // Wall Collision Check
            const maxBound = BOARD_SIZE / 2;
            if (Math.abs(newX) >= maxBound || Math.abs(newZ) >= maxBound) {
                return gameOver("Nabrak Dinding!");
            }

            // Obstacle Collision (Hanya jika tidak melompat)
            if (newY === 0) {
                for (let obs of obstacles) {
                    if (obs.position.x === newX && obs.position.z === newZ) {
                        return gameOver("Nabrak Rintangan!");
                    }
                }
            }

            // Self Collision Check (Hanya jika tidak sedang melompat melangkahi tubuhnya)
            if (newY === 0) {
                for (let i = 1; i < snakeData.length; i++) {
                    if (snakeData[i].x === newX && snakeData[i].z === newZ && snakeData[i].y === 0) {
                        return gameOver("Nabrak Ekor Sendiri!");
                    }
                }
            }

            // Move Body
            const newHeadPos = { x: newX, y: newY, z: newZ };
            snakeData.unshift(newHeadPos);

            // Eat Food Check
            if (newX === food.position.x && newZ === food.position.z && newY === 0) {
                score += 10;
                document.getElementById('score').innerText = score;
                playSound('eat');
                
                // Tambah Panjang Ular
                const newSeg = createCube(0x0099ff);
                snake.push(newSeg);
                spawnFood();
            } else {
                snakeData.pop();
            }

            // Update Mesh Positions
            for (let i = 0; i < snake.length; i++) {
                snake[i].position.set(snakeData[i].x, snakeData[i].y, snakeData[i].z);
            }
        }

        function gameOver(reason) {
            isGameOver = true;
            clearInterval(gameInterval);
            playSound('over');
            
            document.getElementById('modal-title').innerText = "GAME OVER";
            document.getElementById('modal-desc').innerText = `${reason} Skor Akhir Anda: ${score}`;
            document.getElementById('player-name').classList.add('hidden');
            document.getElementById('start-btn').innerText = "MAIN LAGI";
            document.getElementById('game-modal').classList.remove('hidden');

            // Simpan Skor Ke Google Sheets Database
            sendScoreToGoogleSheets(playerName, score);
        }

        // ==========================================
        // GOOGLE SHEETS API INTEGRATION
        // ==========================================
        function sendScoreToGoogleSheets(name, score) {
            if (!GOOGLE_SHEETS_WEB_APP_URL || GOOGLE_SHEETS_WEB_APP_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
                console.warn("Google Sheets Web App URL belum dikonfigurasi!");
                return;
            }

            const payload = {
                nama: name,
                skor: score
            };

            fetch(GOOGLE_SHEETS_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", // Menghindari kendala CORS saat request dari browser
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => console.log("Skor berhasil dikirim ke Google Sheets!"))
            .catch(err => console.error("Gagal mengirim skor:", err));
        }

        // ==========================================
        // CONTROLS & EVENT LISTENERS
        // ==========================================
        function handleInput(dir) {
            if (dir === 'UP' && direction.z === 0) nextDirection = { x: 0, z: -1 };
            if (dir === 'DOWN' && direction.z === 0) nextDirection = { x: 0, z: 1 };
            if (dir === 'LEFT' && direction.x === 0) nextDirection = { x: -1, z: 0 };
            if (dir === 'RIGHT' && direction.x === 0) nextDirection = { x: 1, z: 0 };
        }

        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': handleInput('UP'); break;
                case 'ArrowDown': case 's': case 'S': handleInput('DOWN'); break;
                case 'ArrowLeft': case 'a': case 'A': handleInput('LEFT'); break;
                case 'ArrowRight': case 'd': case 'D': handleInput('RIGHT'); break;
                case ' ': jump(); break;
            }
        });

        // Touch Control Bindings (Mobile/Android)
        document.getElementById('ctrl-up').addEventListener('touchstart', (e) => { e.preventDefault(); handleInput('UP'); });
        document.getElementById('ctrl-down').addEventListener('touchstart', (e) => { e.preventDefault(); handleInput('DOWN'); });
        document.getElementById('ctrl-left').addEventListener('touchstart', (e) => { e.preventDefault(); handleInput('LEFT'); });
        document.getElementById('ctrl-right').addEventListener('touchstart', (e) => { e.preventDefault(); handleInput('RIGHT'); });
        document.getElementById('ctrl-jump').addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
        document.getElementById('ctrl-jump').addEventListener('click', () => jump());

        // Start Button Event
        document.getElementById('start-btn').addEventListener('click', () => {
            const inputName = document.getElementById('player-name').value.trim();
            if (inputName) playerName = inputName;

            document.getElementById('game-modal').classList.add('hidden');
            resetGame();
            gameInterval = setInterval(gameLoop, SPEED);
        });

        // Render Loop (Animation)
        function animate() {
            requestAnimationFrame(animate);
            
            // Animasi Makanan Memutar
            if (food) {
                food.rotation.x += 0.02;
                food.rotation.y += 0.02;
            }

            renderer.render(scene, camera);
        }

        // Initialize App
        init3D();
        animate();
    </script>
</body>
</html>
