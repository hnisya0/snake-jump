<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ular Tangga Modern 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🐍 Ular Tangga Modern 🎲</h1>
        
        <div class="board-wrapper">
            <div id="board" class="board"></div>
        </div>

        <div class="controls">
            <div class="status-panel">
                <p>Giliran: <span id="current-turn" class="player-turn">Pemain 1</span></p>
                <p id="game-status">Lempar dadu untuk memulai!</p>
            </div>

            <div class="dice-panel">
                <div id="dice" class="dice">1</div>
                <button id="roll-btn" class="btn">Kocok Dadu</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
