<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ular Tangga Modern 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- FORM LOGIN PEMAIN -->
        <div id="login-screen" class="screen">
            <h1>🐍 Ular Tangga Modern 🎲</h1>
            <p class="subtitle">Silakan Login Kedua Pemain</p>
            
            <form id="login-form">
                <div class="player-form group-p1">
                    <h3>🔴 Pemain 1</h3>
                    <input type="text" id="p1-username" placeholder="Username Pemain 1" required>
                    <input type="password" id="p1-password" placeholder="Password Pemain 1" required>
                </div>

                <div class="player-form group-p2">
                    <h3>🔵 Pemain 2</h3>
                    <input type="text" id="p2-username" placeholder="Username Pemain 2" required>
                    <input type="password" id="p2-password" placeholder="Password Pemain 2" required>
                </div>

                <button type="submit" class="btn btn-primary">Mulai Permainan</button>
            </form>
        </div>

        <!-- LAYAR GAME -->
        <div id="game-screen" class="screen hidden">
            <h1>🐍 Ular Tangga Modern 🎲</h1>
            
            <div class="board-wrapper">
                <div id="board" class="board"></div>
            </div>

            <div class="controls">
                <div class="status-panel">
                    <p>Giliran: <span id="current-turn" class="player-turn">Pemain 1</span></p>
                    <p id="game-status">Lempar dadu untuk memulai!</p>
                </div>

                <div class="dice-panel">
                    <div id="dice" class="dice">1</div>
                    <button id="roll-btn" class="btn">Kocok Dadu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
