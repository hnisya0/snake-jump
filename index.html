<!-- Tambahkan Tombol Leaderboard di Top Bar UI -->
<div id="ui-container">
    <div class="user-info">
        <div class="badge">Pemain: <span id="display-user">-</span></div>
        <div class="badge">Skor: <span id="score">0</span></div>
        <button id="leaderboard-btn" class="badge-btn">🏆 Leaderboard</button>
    </div>
</div>

<!-- Modal Leaderboard -->
<div id="leaderboard-modal" class="modal hidden">
    <div class="modal-content">
        <h1>🏆 TOP 10 SKOR</h1>
        <ol id="leaderboard-list"></ol>
        <button class="btn" id="close-leaderboard-btn">TUTUP</button>
    </div>
</div>
